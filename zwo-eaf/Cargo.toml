[package]
name = "zwo-eaf"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Steven Michael <ssmichael@gmail.com>"]
license = "MIT"
description = "Safe Rust wrapper for the ZWO EAF (Electronic Automatic Focuser) SDK"
readme = "README.md"
repository = "https://github.com/ssmichael1/zwo-eaf"
keywords = ["zwo", "eaf", "focuser", "astronomy", "astrophotography"]
categories = ["api-bindings", "science", "hardware-support"]

[dependencies]
zwo-eaf-sys = { path = "../zwo-eaf-sys", version = "0.1.0" }
thiserror = "2"

[features]
# Bluetooth LE support (scan, connect, pair, callbacks).
bluetooth = ["zwo-eaf-sys/bluetooth"]

[[example]]
name = "ble_scan"
required-features = ["bluetooth"]

[[test]]
name = "ble"
required-features = ["bluetooth"]

[package.metadata.docs.rs]
features = ["bluetooth"]
rustdoc-args = ["--cfg", "docsrs"]
