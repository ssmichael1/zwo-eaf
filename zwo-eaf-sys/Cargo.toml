[package]
name = "zwo-eaf-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Steven Michael <ssmichael@gmail.com>"]
license = "MIT"
description = "Raw FFI bindings to the ZWO EAF (Electronic Automatic Focuser) C SDK (v1.8.1)"
readme = "README.md"
repository = "https://github.com/ssmichael1/zwo-eaf"
keywords = ["zwo", "eaf", "focuser", "astronomy", "ffi"]
categories = ["external-ffi-bindings", "science", "hardware-support"]
links = "EAFFocuser"

[features]
# Expose the Bluetooth LE functions and callback types.
bluetooth = []

[build-dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[package.metadata.docs.rs]
# Document the Bluetooth LE functions and types too.
features = ["bluetooth"]
